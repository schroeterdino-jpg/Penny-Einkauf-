<!DOCTYPE html>
<html lang="de" class="">
<head>
  <!-- DIREKT ALS ALLERERSTES: Dark-Mode-Skript, um das Aufblitzen zu verhindern -->
  <script>
    try {
      const saved = localStorage.getItem('penny_dark_v125');
      if (saved && JSON.parse(saved) === true) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Einkaufsliste & Vorratsschrank - Schwarzenbek</title>
  
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081967.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/3081/3081967.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Einkauf Dino">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  
  <!-- Verknüpfung zu unserer ausgelagerten CSS-Datei -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen pb-48 bg-stone-100 dark:bg-[#121212] text-[#1c1917] dark:text-[#f5f5f4] transition-colors">
  
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-[#1a1a1a]/90 backdrop-blur-xl border-b border-stone-200/80 dark:border-stone-800/80 px-3 py-3 shadow-sm">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0 flex-1">
        <div class="w-10 h-10 bg-gradient-to-br from-red-600 to-red-700 text-white rounded-2xl flex items-center justify-center font-black text-xl shadow-md shrink-0" id="header-market-icon">🛒</div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1.5 flex-wrap">
            <h1 class="font-extrabold text-sm sm:text-base text-stone-900 dark:text-stone-100 tracking-tight truncate" id="header-market-title">Penny Markt</h1>
            <span class="text-[10px] bg-red-600 text-white px-2.5 py-0.5 rounded-full font-extrabold shadow-xs uppercase tracking-wider" id="header-market-badge">Schwarzenbek</span>
          </div>
          <p class="text-[11px] text-stone-500 dark:text-stone-400 font-semibold truncate flex items-center gap-1">
            <span>📍 Aktiv & Smart</span> • <span id="header-aisle-count">13 Gänge aktiv</span>
          </p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="store-mode-toggle-btn" onclick="state.storeMode = !state.storeMode; saveState(); render();" class="px-3 h-9 rounded-xl bg-stone-100 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 flex items-center justify-center text-xs font-bold shadow-xs gap-1.5 transition-all" title="Einkaufs-Modus an/aus">
          <span id="store-mode-icon">🛍️</span> <span id="store-mode-text" class="font-black">Modus</span>
        </button>
        <button id="theme-toggle-btn" onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl bg-white/80 dark:bg-stone-800/80 border border-stone-200/80 dark:border-stone-700/60 backdrop-blur-sm flex items-center justify-center text-xs font-bold text-stone-700 dark:text-stone-300 shadow-xs" title="Design wechseln">☀️</button>
        <button id="sound-toggle-btn" onclick="state.soundEnabled=!state.soundEnabled; saveState(); render();" class="w-9 h-9 rounded-xl bg-white/80 dark:bg-stone-800/80 border border-stone-200/80 dark:border-stone-700/60 backdrop-blur-sm flex items-center justify-center text-xs font-bold text-stone-700 dark:text-stone-300 shadow-xs" title="Ton an/aus">🔊</button>
      </div>
    </div>
  </header>

  <div id="app" class="max-w-3xl mx-auto px-3 sm:px-4 py-3 space-y-3"></div>

  <div id="toast" class="fixed bottom-36 left-1/2 -translate-x-1/2 z-50 bg-stone-900/95 dark:bg-stone-100/95 backdrop-blur-md text-white dark:text-stone-900 text-xs font-semibold px-4 py-2.5 rounded-2xl shadow-2xl flex items-center gap-2 border border-stone-700 dark:border-stone-300 hidden">
    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span><span id="toast-text"></span>
  </div>

  <nav class="fixed bottom-5 left-3 right-3 z-40 bg-white/95 dark:bg-[#1a1a1a]/95 backdrop-blur-2xl border border-stone-200/80 dark:border-stone-800/80 py-2 px-2 shadow-2xl rounded-3xl">
    <div class="max-w-3xl mx-auto grid grid-cols-5 gap-1">
      <button onclick="state.activeTab='list'; saveState(); render();" class="flex flex-col items-center justify-center py-1.5 rounded-2xl transition-all" id="nav-btn-list"><span class="text-base leading-none">🛒</span><span class="text-[10px] font-bold leading-tight mt-1">Liste</span></button>
      <button onclick="state.activeTab='pantry'; saveState(); render();" class="flex flex-col items-center justify-center py-1.5 rounded-2xl transition-all relative" id="nav-btn-pantry"><span class="text-base leading-none">🥫</span><span class="text-[10px] font-bold leading-tight mt-1">Vorrat</span><span id="nav-pantry-badge" class="absolute top-1 right-3 w-3 h-3 rounded-full bg-red-600 animate-ping hidden"></span></button>
      <button onclick="state.activeTab='favorites'; saveState(); render();" class="flex flex-col items-center justify-center py-1.5 rounded-2xl transition-all" id="nav-btn-favorites"><span class="text-base leading-none">★</span><span class="text-[10px] font-bold leading-tight mt-1">Favoriten</span></button>
      <button onclick="state.activeTab='chat'; saveState(); render();" class="flex flex-col items-center justify-center py-1.5 rounded-2xl transition-all" id="nav-btn-chat"><span class="text-base leading-none">🤖</span><span class="text-[10px] font-bold leading-tight mt-1">KI Chat</span></button>
      <button onclick="state.activeTab='menu'; saveState(); render();" class="flex flex-col items-center justify-center py-1.5 rounded-2xl transition-all" id="nav-btn-menu"><span class="text-base leading-none">☰</span><span class="text-[10px] font-bold leading-tight mt-1">Menü</span></button>
    </div>
  </nav>

  <!-- WICHTIG: data.js muss zuerst geladen werden, danach app.js -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
